[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-telephony"
version = "1.0.0"
authors = [
  { name = "Vamshi Krishna Sonnathi" },
]
description = "Autonomous Human-like AI Phone Calling & Receiving Agent with the 4-Pillar Human Transaction Protocol (Vapi & Retell AI)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Communications :: Telephony",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "requests>=2.31.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-dotenv>=1.0.1",
    "rich>=13.7.1",
]

[project.optional-dependencies]
agents = [
    "crewai>=0.80.0",
    "crewai-tools>=0.14.0",
    "langchain-core>=0.3.0",
]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.urls]
"Homepage" = "https://github.com/vamshisonnathi/agentic-telephony"
"Bug Tracker" = "https://github.com/vamshisonnathi/agentic-telephony/issues"
